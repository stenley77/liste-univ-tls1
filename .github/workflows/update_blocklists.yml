name: Update Multiple Blocklists

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 6'  # Every Saturday at 12:00 UTC

jobs:
  update-blocklists:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download, extract, and process blocklists
      run: |
        ARCHIVES=("ddos" "adult" "malware" "mixed_adult")
        
        for NAME in "${ARCHIVES[@]}"; do
          ARCHIVE_FILE="${NAME}.tar.gz"
          OUTPUT_DIR="${NAME}"
          OUTPUT_FILE="${OUTPUT_DIR}/adguardhome_${NAME}"
          TEMP_FILE="${OUTPUT_DIR}/temp_new_${NAME}"

          echo "Processing $NAME..."
          
          mkdir -p "$OUTPUT_DIR"
          
          # Download and extract
          curl -s "ftp://ftp.ut-capitole.fr/pub/reseau/cache/squidguard_contrib/${ARCHIVE_FILE}" -o "$ARCHIVE_FILE"
          tar -xzf "$ARCHIVE_FILE"
          
          DOMAINS_FILE="${NAME}/domains"
          
          if [[ -f "$DOMAINS_FILE" ]]; then
            # Fast processing with strict filtering - output to TEMP file first
            cat "$DOMAINS_FILE" | \
            # Remove comments and empty lines
            grep -v '^\s*$\|^\s*#' | \
            # Remove lines with wildcards, regex, or special patterns
            grep -v '\*\|(\|)\|\[\|\]\|{\|}\|\\\|\$\|?\||\||' | \
            # Remove IP addresses
            grep -v '^[0-9]\{1,3\}\.[0-9]\{1,3\}\.[0-9]\{1,3\}\.[0-9]\{1,3\}' | \
            # Remove single character domains or too short domains
            awk 'length($0) >= 4' | \
            # Lowercase and trim whitespace
            tr '[:upper:]' '[:lower:]' | \
            tr -d '\r' | \
            sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | \
            # Must contain at least 2 parts (TLD and domain)
            awk -F'.' 'NF >= 2' | \
            # Only keep valid FQDN format with proper length restrictions
            awk '
              /^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+$/ && 
              length($0) <= 253 && 
              length($0) >= 4 {
                # Check that each label is at least 1 char and max 63
                valid = 1
                n = split($0, parts, ".")
                for (i = 1; i <= n; i++) {
                  if (length(parts[i]) < 1 || length(parts[i]) > 63) {
                    valid = 0
                    break
                  }
                }
                if (valid) print
              }
            ' | \
            # CRITICAL: Remove domains with less than 2 characters in any part
            awk -F'.' '{
              valid = 1
              for (i = 1; i <= NF; i++) {
                if (length($i) < 2) {
                  valid = 0
                  break
                }
              }
              if (valid) print
            }' | \
            # Sort and deduplicate
            sort -u | \
            # Convert to AdGuard format
            sed 's/^/||/;s/$/^/' > "$TEMP_FILE"
            
            DOMAIN_COUNT=$(wc -l < "$TEMP_FILE")
            echo "✓ $NAME: $DOMAIN_COUNT valid domains"
            
            # Replace old file with new one (force update)
            mv "$TEMP_FILE" "$OUTPUT_FILE"
          else
            echo "✗ Domains file not found for $NAME"
          fi
          
          # Cleanup archive
          rm -f "$ARCHIVE_FILE"
        done
        
        # Remove all extracted directories
        rm -rf ddos adult malware mixed_adult

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

        MAX_SIZE=104857600      # 100 MB
        SPLIT_SIZE=52428800     # 50 MB

        ARCHIVES=("ddos" "adult" "malware" "mixed_adult")
        CHANGES_MADE=false
        
        for NAME in "${ARCHIVES[@]}"; do
          OUTPUT_FILE="${NAME}/adguardhome_${NAME}"

          if [[ -f "$OUTPUT_FILE" ]]; then
            # Remove old split files if they exist
            rm -f ${OUTPUT_FILE}_part*
            
            FILE_SIZE=$(stat -c%s "$OUTPUT_FILE")

            if (( FILE_SIZE > MAX_SIZE )); then
              echo "$OUTPUT_FILE exceeds 100 MB, splitting into parts..."
              split -b $SPLIT_SIZE -d -a 2 "$OUTPUT_FILE" "${OUTPUT_FILE}_part"
              rm "$OUTPUT_FILE"
              git add ${OUTPUT_FILE}_part*
            else
              git add "$OUTPUT_FILE"
            fi
            
            CHANGES_MADE=true
          fi
        done

        # Check for actual content changes (not just timestamp)
        if git diff --cached --quiet; then
          echo "No content changes detected in blocklists"
        else
          CHANGED_FILES=$(git diff --cached --name-only | wc -l)
          echo "Detected changes in $CHANGED_FILES file(s)"
          git diff --cached --stat
          git commit -m "Update AdGuard Home blocklists [$(date +'%Y-%m-%d %H:%M UTC')]"
          git push
          echo "✓ Blocklists updated and pushed successfully"
        fi
