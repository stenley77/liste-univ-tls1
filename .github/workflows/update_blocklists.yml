name: Update Multiple Blocklists

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 6'  # Every Saturday at 12:00 UTC

jobs:
  update-blocklists:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download, extract, and process blocklists
      run: |
        ARCHIVES=("ddos" "adult" "malware" "mixed_adult")
        
        for NAME in "${ARCHIVES[@]}"; do
          ARCHIVE_FILE="${NAME}.tar.gz"
          OUTPUT_DIR="${NAME}"
          OUTPUT_FILE="${OUTPUT_DIR}/adguardhome_${NAME}"

          echo "==========================================="
          echo "Processing $NAME..."
          echo "==========================================="
          
          START_TIME=$(date +%s)
          mkdir -p "$OUTPUT_DIR"
          
          # Download and extract
          curl -s "ftp://ftp.ut-capitole.fr/pub/reseau/cache/squidguard_contrib/${ARCHIVE_FILE}" -o "$ARCHIVE_FILE"
          tar -xzf "$ARCHIVE_FILE"
          
          DOMAINS_FILE="${NAME}/domains"
          
          if [[ -f "$DOMAINS_FILE" ]]; then
            TOTAL_LINES=$(wc -l < "$DOMAINS_FILE")
            echo "📥 Source file: $TOTAL_LINES total lines"
            
            # Ultra-fast single-pass processing with AWK
            awk '
            BEGIN {
              FS = "."
              OFS = "."
            }
            
            # Skip empty lines, comments, IPs
            /^[[:space:]]*$/ { next }
            /^[[:space:]]*#/ { next }
            /^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}/ { next }
            
            # Skip lines with invalid characters
            /[\*\(\)\[\]\{\}\\$?|]/ { next }
            /https?:\/\// { next }
            /\/\// { next }
            
            {
              # Convert to lowercase and clean
              line = tolower($0)
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", line)
              gsub(/\r/, "", line)
              
              # Remove port numbers
              sub(/:[0-9]+$/, "", line)
              
              # Remove paths
              sub(/\/.*$/, "", line)
              
              # Remove existing ||, ^, or leading dots
              gsub(/^\|\|/, "", line)
              gsub(/\^$/, "", line)
              gsub(/^\.+|\.+$/, "", line)
              
              # Skip if empty after cleaning
              if (length(line) == 0) next
              
              # Must contain at least one dot
              if (index(line, ".") == 0) next
              
              # Validate domain format
              if (!match(line, /^[a-z0-9.-]+$/)) next
              
              # Check for double dots
              if (index(line, "..") > 0) next
              
              # Split and validate
              split(line, parts, ".")
              nparts = length(parts)
              
              # Must have at least 2 parts
              if (nparts < 2) next
              
              # TLD and second-level must be >= 2 chars
              tld = parts[nparts]
              sld = parts[nparts-1]
              
              if (length(tld) < 2 || length(sld) < 2) next
              
              # Total length check
              if (length(line) < 4 || length(line) > 253) next
              
              # Store domain
              domains[line] = 1
            }
            
            END {
              # Sort domains by dot count (fewer dots first for parent domains)
              n = 0
              for (domain in domains) {
                sorted[n++] = domain
              }
              
              # Bubble sort by dot count (simple but effective for this use case)
              for (i = 0; i < n-1; i++) {
                for (j = i+1; j < n; j++) {
                  count_i = gsub(/\./, ".", sorted[i])
                  gsub(/[^\.]/, "", temp1); count_i = length(temp1)
                  
                  count_j = gsub(/\./, ".", sorted[j])
                  gsub(/[^\.]/, "", temp2); count_j = length(temp2)
                  
                  # Sort by dot count, then alphabetically
                  split(sorted[i], pi, ".")
                  split(sorted[j], pj, ".")
                  
                  if (length(pi) > length(pj) || (length(pi) == length(pj) && sorted[i] > sorted[j])) {
                    temp = sorted[i]
                    sorted[i] = sorted[j]
                    sorted[j] = temp
                  }
                }
              }
              
              # Aggregate: skip subdomains if parent exists
              for (i = 0; i < n; i++) {
                domain = sorted[i]
                is_subdomain = 0
                
                # Check if parent domain exists
                split(domain, parts, ".")
                nparts = length(parts)
                
                for (level = 2; level <= nparts; level++) {
                  parent = ""
                  for (k = nparts - level + 1; k <= nparts; k++) {
                    parent = parent (parent ? "." : "") parts[k]
                  }
                  if (parent != domain && parent in blocked) {
                    is_subdomain = 1
                    break
                  }
                }
                
                if (!is_subdomain) {
                  blocked[domain] = 1
                  final[final_count++] = domain
                }
              }
              
              # Output in AdGuard format (sorted alphabetically)
              asort(final, output)
              for (i = 1; i <= final_count; i++) {
                print "||" output[i] "^"
              }
            }
            ' "$DOMAINS_FILE" > "$OUTPUT_FILE"
            
            FINAL_COUNT=$(wc -l < "$OUTPUT_FILE")
            END_TIME=$(date +%s)
            ELAPSED=$((END_TIME - START_TIME))
            
            echo "📤 Final output: $FINAL_COUNT rules"
            echo "⏱️  Processing time: ${ELAPSED}s"
            
            REDUCTION_PERCENT=$(awk "BEGIN {printf \"%.1f\", (1 - $FINAL_COUNT / $TOTAL_LINES) * 100}")
            echo "📊 Reduction: ${REDUCTION_PERCENT}%"
            
            echo ""
            echo "📋 First 10 entries:"
            head -10 "$OUTPUT_FILE"
            
            echo ""
            echo "📋 Last 10 entries:"
            tail -10 "$OUTPUT_FILE"
            
            if [[ -f "$OUTPUT_FILE.old" ]]; then
              OLD_COUNT=$(wc -l < "$OUTPUT_FILE.old")
              echo ""
              echo "📊 Comparison:"
              echo "   Old: $OLD_COUNT | New: $FINAL_COUNT | Diff: $((FINAL_COUNT - OLD_COUNT))"
            fi
            
            cp "$OUTPUT_FILE" "$OUTPUT_FILE.old" 2>/dev/null || true
            echo "✅ $NAME complete"
            echo ""
            
          else
            echo "❌ Domains file not found: $DOMAINS_FILE"
          fi
          
          rm -f "$ARCHIVE_FILE"
        done
        
        rm -rf ddos adult malware mixed_adult

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

        MAX_SIZE=104857600
        SPLIT_SIZE=52428800

        ARCHIVES=("ddos" "adult" "malware" "mixed_adult")
        
        for NAME in "${ARCHIVES[@]}"; do
          OUTPUT_FILE="${NAME}/adguardhome_${NAME}"

          if [[ -f "$OUTPUT_FILE" ]]; then
            rm -f ${OUTPUT_FILE}_part*
            
            FILE_SIZE=$(stat -c%s "$OUTPUT_FILE")

            if (( FILE_SIZE > MAX_SIZE )); then
              echo "$OUTPUT_FILE exceeds 100 MB, splitting..."
              split -b $SPLIT_SIZE -d -a 2 "$OUTPUT_FILE" "${OUTPUT_FILE}_part"
              rm "$OUTPUT_FILE"
              git add ${OUTPUT_FILE}_part*
            else
              git add "$OUTPUT_FILE"
            fi
          fi
        done

        if git diff --cached --quiet; then
          echo "⚠️ No content changes detected"
        else
          CHANGED_FILES=$(git diff --cached --name-only | wc -l)
          echo "✅ Changes detected: $CHANGED_FILES file(s)"
          git diff --cached --stat
          git commit -m "Update AdGuard Home blocklists [$(date +'%Y-%m-%d %H:%M UTC')]"
          git push
          echo "✅ Blocklists updated and pushed"
        fi
