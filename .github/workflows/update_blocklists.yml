name: Update Multiple Blocklists

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 6'  # Every Saturday at 12:00 UTC

jobs:
  update-blocklists:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download, extract, and process blocklists
      run: |
        ARCHIVES=("ddos" "adult" "malware" "mixed_adult")
        
        for NAME in "${ARCHIVES[@]}"; do
          ARCHIVE_FILE="${NAME}.tar.gz"
          OUTPUT_DIR="${NAME}"
          OUTPUT_FILE="${OUTPUT_DIR}/adguardhome_${NAME}"

          echo "==========================================="
          echo "Processing $NAME..."
          echo "==========================================="
          
          START_TIME=$(date +%s)
          mkdir -p "$OUTPUT_DIR"
          
          # Download and extract
          curl -s "ftp://ftp.ut-capitole.fr/pub/reseau/cache/squidguard_contrib/${ARCHIVE_FILE}" -o "$ARCHIVE_FILE"
          tar -xzf "$ARCHIVE_FILE"
          
          DOMAINS_FILE="${NAME}/domains"
          
          if [[ -f "$DOMAINS_FILE" ]]; then
            TOTAL_LINES=$(wc -l < "$DOMAINS_FILE")
            echo "📥 Source file: $TOTAL_LINES total lines"
            
            # Fast processing with simple pipeline
            cat "$DOMAINS_FILE" | \
            # Remove comments, empty lines, trim whitespace
            sed -e 's/#.*//' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d' | \
            # Convert to lowercase
            tr '[:upper:]' '[:lower:]' | \
            # Remove carriage returns
            tr -d '\r' | \
            # Remove IP addresses (simple pattern)
            grep -vE '^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}' | \
            # Remove entries with invalid characters
            grep -vE '[\*\(\)\[\]\{\}\\$?|]|https?://|//' | \
            # Remove port numbers and paths
            sed -e 's/:[0-9]*$//' -e 's/\/.*$//' | \
            # Remove existing ||, ^, leading/trailing dots
            sed -e s'/^|*||*//' -e 's/\^*$//' -e 's/^\.*\|\.*$//' | \
            # Must contain at least one dot
            grep '\.' | \
            # Basic domain validation: alphanumeric, dots, hyphens only
            grep -E '^[a-z0-9.-]+$' | \
            # No double dots
            grep -v '\.\.' | \
            # Minimum length 4 (x.yy format)
            awk 'length($0) >= 4 && length($0) <= 253' | \
            # TLD and second-level domain must be at least 2 chars
            awk -F. '{if (length($NF) >= 2 && length($(NF-1)) >= 2) print}' | \
            # Sort and deduplicate
            sort -u > "${OUTPUT_DIR}/temp_sorted"
            
            echo "🔄 Aggregating subdomains..."
            
            # Fast subdomain aggregation with awk
            awk -F. '{
              # Store domain
              domain = $0
              domains[domain] = 1
              
              # Store all parent domains
              n = NF
              for (i = 2; i <= n; i++) {
                parent = ""
                for (j = i; j <= n; j++) {
                  parent = parent (parent ? "." : "") $j
                }
                parents[domain] = parents[domain] " " parent
              }
            }
            END {
              # Output only if no parent domain exists
              for (domain in domains) {
                keep = 1
                split(parents[domain], p, " ")
                for (i in p) {
                  if (p[i] != "" && p[i] != domain && p[i] in domains) {
                    keep = 0
                    break
                  }
                }
                if (keep) print "||" domain "^"
              }
            }' "${OUTPUT_DIR}/temp_sorted" | sort > "$OUTPUT_FILE"
            
            rm -f "${OUTPUT_DIR}/temp_sorted"
            
            FINAL_COUNT=$(wc -l < "$OUTPUT_FILE")
            END_TIME=$(date +%s)
            ELAPSED=$((END_TIME - START_TIME))
            
            echo "📤 Final output: $FINAL_COUNT rules"
            echo "⏱️  Processing time: ${ELAPSED}s"
            
            if [ $TOTAL_LINES -gt 0 ]; then
              REDUCTION_PERCENT=$(awk "BEGIN {printf \"%.1f\", (1 - $FINAL_COUNT / $TOTAL_LINES) * 100}")
              echo "📊 Reduction: ${REDUCTION_PERCENT}%"
            fi
            
            echo ""
            echo "📋 First 10 entries:"
            head -10 "$OUTPUT_FILE"
            
            echo ""
            echo "📋 Last 10 entries:"
            tail -10 "$OUTPUT_FILE"
            
            echo "✅ $NAME complete"
            echo ""
            
          else
            echo "❌ Domains file not found: $DOMAINS_FILE"
          fi
          
          rm -f "$ARCHIVE_FILE"
        done
        
        rm -rf ddos adult malware mixed_adult

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

        MAX_SIZE=104857600
        SPLIT_SIZE=52428800

        ARCHIVES=("ddos" "adult" "malware" "mixed_adult")
        
        for NAME in "${ARCHIVES[@]}"; do
          OUTPUT_FILE="${NAME}/adguardhome_${NAME}"

          if [[ -f "$OUTPUT_FILE" ]]; then
            rm -f ${OUTPUT_FILE}_part*
            
            FILE_SIZE=$(stat -c%s "$OUTPUT_FILE")

            if (( FILE_SIZE > MAX_SIZE )); then
              echo "$OUTPUT_FILE exceeds 100 MB, splitting..."
              split -b $SPLIT_SIZE -d -a 2 "$OUTPUT_FILE" "${OUTPUT_FILE}_part"
              rm "$OUTPUT_FILE"
              git add ${OUTPUT_FILE}_part*
            else
              git add "$OUTPUT_FILE"
            fi
          fi
        done

        if git diff --cached --quiet; then
          echo "⚠️ No content changes detected"
        else
          CHANGED_FILES=$(git diff --cached --name-only | wc -l)
          echo "✅ Changes detected: $CHANGED_FILES file(s)"
          git diff --cached --stat
          git commit -m "Update AdGuard Home blocklists [$(date +'%Y-%m-%d %H:%M UTC')]"
          git push
          echo "✅ Blocklists updated and pushed"
        fi
