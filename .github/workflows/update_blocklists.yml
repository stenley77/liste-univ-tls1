name: Update Multiple Blocklists

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 6'  # Every Saturday at 12:00 UTC

jobs:
  update-blocklists:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y curl tar

    - name: Download, extract, and process blocklists
      run: |
        ARCHIVES=("ddos" "adult" "malware" "mixed_adult")
        
        for NAME in "${ARCHIVES[@]}"; do
          ARCHIVE_FILE="${NAME}.tar.gz"
          OUTPUT_DIR="${NAME}"
          OUTPUT_FILE="${OUTPUT_DIR}/adguardhome_${NAME}"
          TEMP_FILE="${OUTPUT_DIR}/temp_${NAME}"

          echo "Downloading $ARCHIVE_FILE..."
          curl -o "$ARCHIVE_FILE" "ftp://ftp.ut-capitole.fr/pub/reseau/cache/squidguard_contrib/${ARCHIVE_FILE}"

          echo "Extracting $ARCHIVE_FILE..."
          tar -xzf "$ARCHIVE_FILE"

          mkdir -p "$OUTPUT_DIR"

          DOMAINS_FILE="${NAME}/domains"

          if [[ -f "$DOMAINS_FILE" ]]; then
            echo "Processing $DOMAINS_FILE..."
            
            # Step 1: Clean, validate, and normalize domains
            > "$TEMP_FILE"
            grep -v '^\s*$\|^\s*#' "$DOMAINS_FILE" | \
            tr '[:upper:]' '[:lower:]' | \
            tr -d '\r' | \
            awk '/^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$/ {print}' | \
            sort -u > "$TEMP_FILE"
            
            # Step 2: Fast subdomain removal using reverse domain sorting
            echo "Optimizing domain list..."
            
            awk '
            BEGIN {
              FS = "."
            }
            {
              # Reverse the domain for efficient parent matching
              reversed = ""
              for (i = NF; i >= 1; i--) {
                if (reversed != "") reversed = reversed "."
                reversed = reversed $i
              }
              print reversed, $0
            }
            ' "$TEMP_FILE" | \
            sort -t' ' -k1,1 | \
            awk '
            {
              reversed = $1
              original = $2
              
              # Check if this domain is a subdomain of the previous one
              if (prev_reversed != "" && index(reversed, prev_reversed ".") == 1) {
                # This is a subdomain of previous domain, skip it
                skipped++
                next
              }
              
              # This is a new parent domain
              prev_reversed = reversed
              print "||" original "^"
              kept++
            }
            END {
              if (skipped > 0) {
                print "# Removed " skipped " redundant subdomains" > "/dev/stderr"
              }
            }
            ' > "$OUTPUT_FILE"
            
            ORIGINAL_COUNT=$(wc -l < "$TEMP_FILE")
            OPTIMIZED_COUNT=$(wc -l < "$OUTPUT_FILE")
            SAVED=$((ORIGINAL_COUNT - OPTIMIZED_COUNT))
            
            echo "✓ $NAME: $ORIGINAL_COUNT domains → $OPTIMIZED_COUNT rules (saved $SAVED redundant entries)"
            
            rm "$TEMP_FILE"
          else
            echo "Domains file not found for $NAME, skipping."
          fi
        done

    - name: Cleanup extracted files
      run: |
        echo "Cleaning up extracted files..."
        rm -rf ddos adult malware mixed_adult
        rm -f *.tar.gz

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

        MAX_SIZE=104857600      # 100 MB
        SPLIT_SIZE=52428800     # 50 MB

        ARCHIVES=("ddos" "adult" "malware" "mixed_adult")

        for NAME in "${ARCHIVES[@]}"; do
          OUTPUT_FILE="${NAME}/adguardhome_${NAME}"

          if [[ -f "$OUTPUT_FILE" ]]; then
            FILE_SIZE=$(stat -c%s "$OUTPUT_FILE")

            if (( FILE_SIZE > MAX_SIZE )); then
              echo "$OUTPUT_FILE exceeds 100 MB, splitting..."
              rm -f ${OUTPUT_FILE}_part*
              split -b $SPLIT_SIZE -d -a 2 --additional-suffix="" "$OUTPUT_FILE" "${OUTPUT_FILE}_part"
              rm "$OUTPUT_FILE"
              git add "${OUTPUT_FILE}_part"*
            else
              git add "$OUTPUT_FILE"
            fi
          fi
        done

        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Update AdGuard Home blocklists [$(date +'%Y-%m-%d')]"
          git push
        fi
