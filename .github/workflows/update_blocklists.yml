name: Update Multiple Blocklists

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 6'  # Every Saturday at 12:00 UTC

jobs:
  update-blocklists:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y curl tar

    - name: Download, extract, and process blocklists
      run: |
        ARCHIVES=("ddos" "adult" "malware" "mixed_adult")
        
        for NAME in "${ARCHIVES[@]}"; do
          ARCHIVE_FILE="${NAME}.tar.gz"
          OUTPUT_DIR="${NAME}"
          OUTPUT_FILE="${OUTPUT_DIR}/adguardhome_${NAME}"
          TEMP_FILE="${OUTPUT_DIR}/temp_${NAME}"

          echo "Downloading $ARCHIVE_FILE..."
          curl -o "$ARCHIVE_FILE" "ftp://ftp.ut-capitole.fr/pub/reseau/cache/squidguard_contrib/${ARCHIVE_FILE}"

          echo "Extracting $ARCHIVE_FILE..."
          tar -xzf "$ARCHIVE_FILE"

          mkdir -p "$OUTPUT_DIR"

          DOMAINS_FILE="${NAME}/domains"

          if [[ -f "$DOMAINS_FILE" ]]; then
            echo "Processing $DOMAINS_FILE..."
            
            # Step 1: Clean and validate domains
            > "$TEMP_FILE"
            while IFS= read -r domain || [[ -n "$domain" ]]; do
              # Skip empty lines, comments, and whitespace
              [[ -z "$domain" || "$domain" =~ ^[[:space:]]*# ]] && continue
              
              # Remove whitespace and convert to lowercase
              domain=$(echo "$domain" | xargs | tr '[:upper:]' '[:lower:]')
              
              # Validate domain format
              [[ ! "$domain" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$ ]] && continue
              
              echo "$domain" >> "$TEMP_FILE"
            done < "$DOMAINS_FILE"
            
            # Step 2: Sort and deduplicate
            sort -u "$TEMP_FILE" -o "$TEMP_FILE"
            
            # Step 3: Remove subdomains when parent domain exists
            echo "Optimizing domain list (removing redundant subdomains)..."
            > "$OUTPUT_FILE"
            
            awk '
            {
              domain = $0
              # Check if any parent domain already exists
              is_subdomain = 0
              split(domain, parts, ".")
              
              # Build parent domains
              for (i = 2; i <= length(parts); i++) {
                parent = ""
                for (j = i; j <= length(parts); j++) {
                  if (parent != "") parent = parent "."
                  parent = parent parts[j]
                }
                if (domains[parent]) {
                  is_subdomain = 1
                  break
                }
              }
              
              if (!is_subdomain) {
                domains[domain] = 1
                print "||" domain "^"
              }
            }
            ' "$TEMP_FILE" >> "$OUTPUT_FILE"
            
            ORIGINAL_COUNT=$(wc -l < "$TEMP_FILE")
            OPTIMIZED_COUNT=$(wc -l < "$OUTPUT_FILE")
            SAVED=$((ORIGINAL_COUNT - OPTIMIZED_COUNT))
            
            echo "✓ $NAME: $ORIGINAL_COUNT domains → $OPTIMIZED_COUNT rules (saved $SAVED redundant entries)"
            
            rm "$TEMP_FILE"
          else
            echo "Domains file not found for $NAME, skipping."
          fi
        done

    - name: Cleanup extracted files
      run: |
        echo "Cleaning up extracted files..."
        rm -rf ddos adult malware mixed_adult
        rm -f *.tar.gz

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

        MAX_SIZE=104857600      # 100 MB
        SPLIT_SIZE=52428800     # 50 MB

        ARCHIVES=("ddos" "adult" "malware" "mixed_adult")

        for NAME in "${ARCHIVES[@]}"; do
          OUTPUT_FILE="${NAME}/adguardhome_${NAME}"

          if [[ -f "$OUTPUT_FILE" ]]; then
            FILE_SIZE=$(stat -c%s "$OUTPUT_FILE")

            if (( FILE_SIZE > MAX_SIZE )); then
              echo "$OUTPUT_FILE exceeds 100 MB, splitting..."
              rm -f ${OUTPUT_FILE}_part*
              split -b $SPLIT_SIZE -d -a 2 --additional-suffix="" "$OUTPUT_FILE" "${OUTPUT_FILE}_part"
              rm "$OUTPUT_FILE"
              git add "${OUTPUT_FILE}_part"*
            else
              git add "$OUTPUT_FILE"
            fi
          fi
        done

        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Update AdGuard Home blocklists [$(date +'%Y-%m-%d')]"
          git push
        fi
