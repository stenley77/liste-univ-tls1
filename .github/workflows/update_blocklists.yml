name: Update Multiple Blocklists

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 6'  # Every Saturday at 12:00 UTC

jobs:
  update-blocklists:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download, extract, and process blocklists
      run: |
        ARCHIVES=("ddos" "adult" "malware" "mixed_adult")
        
        for NAME in "${ARCHIVES[@]}"; do
          ARCHIVE_FILE="${NAME}.tar.gz"
          OUTPUT_DIR="${NAME}"
          OUTPUT_FILE="${OUTPUT_DIR}/adguardhome_${NAME}"
          TEMP_FILE="${OUTPUT_DIR}/temp_new_${NAME}"

          echo "==========================================="
          echo "Processing $NAME..."
          echo "==========================================="
          
          mkdir -p "$OUTPUT_DIR"
          
          # Download and extract
          curl -s "ftp://ftp.ut-capitole.fr/pub/reseau/cache/squidguard_contrib/${ARCHIVE_FILE}" -o "$ARCHIVE_FILE"
          tar -xzf "$ARCHIVE_FILE"
          
          DOMAINS_FILE="${NAME}/domains"
          
          if [[ -f "$DOMAINS_FILE" ]]; then
            TOTAL_LINES=$(wc -l < "$DOMAINS_FILE")
            echo "📥 Source file: $TOTAL_LINES total lines"
            
            # Show sample of problematic entries that will be filtered
            echo ""
            echo "🔍 Sample of SHORT entries (< 6 chars) in source:"
            cat "$DOMAINS_FILE" | grep -v '^\s*$\|^\s*#' | awk 'length($0) < 6' | head -10 || echo "  (none found)"
            
            echo ""
            echo "🔍 Sample of entries with WILDCARDS:"
            cat "$DOMAINS_FILE" | grep '\*' | head -10 || echo "  (none found)"
            
            echo ""
            echo "🔍 Sample of entries with SINGLE-CHAR labels:"
            cat "$DOMAINS_FILE" | grep -E '(^|\.)[a-z](\.|$)' | head -10 || echo "  (none found)"
            
            # Process with filters
            cat "$DOMAINS_FILE" | \
            grep -v '^\s*$\|^\s*#' | \
            grep -v '\*\|(\|)\|\[\|\]\|{\|}\|\\\|\$\|?\||\||' | \
            grep -v '^[0-9]\{1,3\}\.[0-9]\{1,3\}\.[0-9]\{1,3\}\.[0-9]\{1,3\}' | \
            awk 'length($0) >= 4' | \
            tr '[:upper:]' '[:lower:]' | \
            tr -d '\r' | \
            sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | \
            awk -F'.' 'NF >= 2' | \
            awk '
              /^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+$/ && 
              length($0) <= 253 && 
              length($0) >= 4 {
                valid = 1
                n = split($0, parts, ".")
                for (i = 1; i <= n; i++) {
                  if (length(parts[i]) < 1 || length(parts[i]) > 63) {
                    valid = 0
                    break
                  }
                }
                if (valid) print
              }
            ' | \
            awk -F'.' '{
              valid = 1
              for (i = 1; i <= NF; i++) {
                if (length($i) < 2) {
                  valid = 0
                  break
                }
              }
              if (valid) print
            }' | \
            sort -u | \
            sed 's/^/||/;s/$/^/' > "$TEMP_FILE"
            
            NEW_COUNT=$(wc -l < "$TEMP_FILE")
            echo ""
            echo "📤 After filtering: $NEW_COUNT valid domains"
            
            if [[ -f "$OUTPUT_FILE" ]]; then
              OLD_COUNT=$(wc -l < "$OUTPUT_FILE")
              DIFF_COUNT=$((NEW_COUNT - OLD_COUNT))
              echo "📊 Comparison:"
              echo "   Old file: $OLD_COUNT domains"
              echo "   New file: $NEW_COUNT domains"
              echo "   Difference: $DIFF_COUNT domains"
              
              # Show sample differences
              echo ""
              echo "🔍 Sample entries REMOVED (in old, not in new):"
              comm -23 <(sort "$OUTPUT_FILE") <(sort "$TEMP_FILE") | head -10 || echo "  (none)"
              
              echo ""
              echo "🔍 Sample entries ADDED (in new, not in old):"
              comm -13 <(sort "$OUTPUT_FILE") <(sort "$TEMP_FILE") | head -10 || echo "  (none)"
            else
              echo "📊 New file created: $NEW_COUNT domains"
            fi
            
            # Replace old file with new one
            mv "$TEMP_FILE" "$OUTPUT_FILE"
            
            echo ""
            echo "✅ $NAME processing complete"
            
          else
            echo "❌ Domains file not found: $DOMAINS_FILE"
          fi
          
          rm -f "$ARCHIVE_FILE"
          echo ""
        done
        
        rm -rf ddos adult malware mixed_adult

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

        MAX_SIZE=104857600
        SPLIT_SIZE=52428800

        ARCHIVES=("ddos" "adult" "malware" "mixed_adult")
        
        for NAME in "${ARCHIVES[@]}"; do
          OUTPUT_FILE="${NAME}/adguardhome_${NAME}"

          if [[ -f "$OUTPUT_FILE" ]]; then
            rm -f ${OUTPUT_FILE}_part*
            
            FILE_SIZE=$(stat -c%s "$OUTPUT_FILE")

            if (( FILE_SIZE > MAX_SIZE )); then
              echo "$OUTPUT_FILE exceeds 100 MB, splitting into parts..."
              split -b $SPLIT_SIZE -d -a 2 "$OUTPUT_FILE" "${OUTPUT_FILE}_part"
              rm "$OUTPUT_FILE"
              git add ${OUTPUT_FILE}_part*
            else
              git add "$OUTPUT_FILE"
            fi
          fi
        done

        if git diff --cached --quiet; then
          echo ""
          echo "============================================"
          echo "⚠️  NO CONTENT CHANGES DETECTED"
          echo "============================================"
          echo "This means the filtering produced identical results."
          echo "The source blocklists may already be clean, OR"
          echo "the filters are not catching the problematic entries."
          echo ""
          echo "Git status:"
          git status --short
        else
          CHANGED_FILES=$(git diff --cached --name-only | wc -l)
          echo ""
          echo "============================================"
          echo "✅ CHANGES DETECTED: $CHANGED_FILES file(s)"
          echo "============================================"
          git diff --cached --stat
          git commit -m "Update AdGuard Home blocklists [$(date +'%Y-%m-%d %H:%M UTC')]"
          git push
          echo ""
          echo "✅ Blocklists updated and pushed successfully"
        fi
