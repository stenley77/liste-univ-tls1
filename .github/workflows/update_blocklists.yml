name: Update AdGuard Blocklists

on:
  schedule:
    - cron: '0 12 * * 6'  # Samedi à 12h UTC comme le projet source
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: 
      - 'src/**'
      - '.github/workflows/**'

jobs:
  update-blocklists:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt

      - name: Create output directories
        run: |
          mkdir -p output/adguard/adult
          mkdir -p output/adguard/malware
          mkdir -p output/adguard/mixed_adult
          mkdir -p output/adguard/ddos

      - name: Download and setup converter script
        run: |
          # Le script est maintenant correct, pas besoin de le recréer
          if [ -f "src/blacklist_converter.py" ]; then
            echo "✅ Script convertisseur trouvé"
            chmod +x src/blacklist_converter.py
          else
            echo "❌ Script convertisseur manquant"
            exit 1
          fi

      - name: Run blacklist converter
        run: |
          cd ${{ github.workspace }}
          python src/blacklist_converter.py --verbose
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Generate statistics and README
        run: |
          echo "# 🛡️ AdGuard Blocklists - UT Capitole" > output/adguard/README.md
          echo "" >> output/adguard/README.md
          echo "Listes de blocage AdGuardHome générées à partir des [listes noires de l'Université Toulouse 1 Capitole](ftp://ftp.ut-capitole.fr/pub/reseau/cache/squidguard_contrib/)." >> output/adguard/README.md
          echo "" >> output/adguard/README.md
          echo "**Dernière mise à jour:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> output/adguard/README.md
          echo "" >> output/adguard/README.md
          echo "## 📊 Statistiques" >> output/adguard/README.md
          echo "" >> output/adguard/README.md
          echo "| Catégorie | Fichier | Règles | Taille |" >> output/adguard/README.md
          echo "|-----------|---------|--------|--------|" >> output/adguard/README.md
          
          for category in adult malware mixed_adult ddos; do
            category_dir="output/adguard/$category"
            if [ -d "$category_dir" ]; then
              for file in "$category_dir"/*; do
                if [ -f "$file" ]; then
                  filename=$(basename "$file")
                  rules=$(grep -c "^||.*\^$" "$file" 2>/dev/null || echo "0")
                  size=$(stat -c%s "$file" | numfmt --to=iec)
                  rel_path="${category}/${filename}"
                  echo "| $category | [\`$filename\`]($rel_path) | $rules | $size |" >> output/adguard/README.md
                fi
              done
            fi
          done
          
          echo "" >> output/adguard/README.md
          echo "## 🚀 Utilisation" >> output/adguard/README.md
          echo "" >> output/adguard/README.md
          echo "### URLs pour AdGuardHome:" >> output/adguard/README.md
          echo "" >> output/adguard/README.md
          
          for category in adult malware mixed_adult ddos; do
            echo "**$category:**" >> output/adguard/README.md
            category_dir="output/adguard/$category"
            if [ -d "$category_dir" ]; then
              for file in "$category_dir"/adguardhome_*; do
                if [ -f "$file" ]; then
                  filename=$(basename "$file")
                  echo "- \`https://raw.githubusercontent.com/${{ github.repository }}/main/output/adguard/$category/$filename\`" >> output/adguard/README.md
                fi
              done
            fi
            echo "" >> output/adguard/README.md
          done

      - name: Validate output files
        run: |
          echo "🔍 Validation des fichiers générés..."
          error_count=0
          
          for category in adult malware mixed_adult ddos; do
            category_dir="output/adguard/$category"
            if [ -d "$category_dir" ]; then
              for file in "$category_dir"/*; do
                if [ -f "$file" ]; then
                  echo "Validation de $file..."
                  
                  # Vérification du format AdGuard
                  if ! grep -q "^||.*\^$" "$file"; then
                    echo "❌ Aucune règle AdGuard trouvée dans $file"
                    ((error_count++))
                  fi
                  
                  # Vérification de l'en-tête
                  if ! grep -q "^! Title:" "$file"; then
                    echo "❌ En-tête manquant dans $file"
                    ((error_count++))
                  fi
                fi
              done
            fi
          done
          
          if [ $error_count -gt 0 ]; then
            echo "❌ $error_count erreur(s) détectée(s)"
            exit 1
          else
            echo "✅ Tous les fichiers sont valides"
          fi

      - name: Setup Git config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Handle large files and commit
        run: |
          # Suppression des anciens fichiers splittés
          find output/adguard -name "*_part*" -delete
          
          MAX_SIZE=104857600  # 100MB
          SPLIT_SIZE=52428800  # 50MB
          
          for category in adult malware mixed_adult ddos; do
            category_dir="output/adguard/$category"
            if [ -d "$category_dir" ]; then
              for file in "$category_dir"/adguardhome_*; do
                if [ -f "$file" ] && [[ ! "$file" == *"_part"* ]]; then
                  file_size=$(stat -c%s "$file")
                  if (( file_size > MAX_SIZE )); then
                    echo "📦 $file dépasse 100MB ($(numfmt --to=iec $file_size)), division..."
                    split -b $SPLIT_SIZE -d -a 2 "$file" "${file}_part"
                    rm "$file"
                    echo "✅ Divisé en $(ls ${file}_part* | wc -l) parties"
                    git add ${file}_part*
                  else
                    echo "✅ $file OK ($(numfmt --to=iec $file_size))"
                    git add "$file"
                  fi
                fi
              done
            fi
          done
          
          git add output/adguard/README.md

      - name: Commit and push changes
        run: |
          if git diff --cached --quiet; then
            echo "⚠️ Aucun changement détecté"
          else
            changed_files=$(git diff --cached --name-only | wc -l)
            echo "✅ Changements détectés dans $changed_files fichier(s):"
            git diff --cached --name-status
            echo ""
            git diff --cached --stat
            
            commit_msg="🤖 Update AdGuard Home blocklists [$(date +'%Y-%m-%d %H:%M UTC')]"
            git commit -m "$commit_msg"
            git push
            
            echo "✅ Listes mises à jour et publiées avec succès"
          fi

  validate-lists:
    runs-on: ubuntu-latest
    needs: update-blocklists
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Test list accessibility
        run: |
          echo "🧪 Test d'accessibilité des listes..."
          base_url="https://raw.githubusercontent.com/${{ github.repository }}/main/output/adguard"
          
          for category in adult malware mixed_adult ddos; do
            echo "Testing $category..."
            for file in output/adguard/$category/*; do
              if [ -f "$file" ]; then
                filename=$(basename "$file")
                url="$base_url/$category/$filename"
                if curl -s -f -I "$url" > /dev/null; then
                  echo "✅ $url accessible"
                else
                  echo "❌ $url non accessible"
                fi
              fi
            done
          done
